[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# The release workflow is intentionally customized for SBOM/provenance steps.
allow-dirty = ["ci"]
# Packages to publish from this workspace
packages = ["shk-cli"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# GitHub repo (owner/name) to publish the generated Homebrew formula to.
# Users install with `brew install Kazuki-tam/homebrew-tap/shk`
# (Homebrew drops the `homebrew-` prefix, so the short form is
# `brew install kazuki-tam/tap/shk`).
tap = "Kazuki-tam/homebrew-tap"
# Publish jobs to run in CI. The Homebrew push itself is wired into the
# hand-maintained release workflow (publish-homebrew-formula job); this entry
# keeps the dist config canonical for `dist plan` / `dist generate`.
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Where to host releases
hosting = "github"

# Keep these in sync with the custom release workflow's Linux setup step.
[dist.dependencies.apt]
libdbus-1-dev = { version = "*", targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
libgtk-3-dev = { version = "*", targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
libwebkit2gtk-4.1-dev = { version = "*", targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
pkg-config = { version = "*", targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
