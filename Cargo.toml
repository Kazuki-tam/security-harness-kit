[workspace]
resolver = "2"
members = [
    "apps/shk-desktop/src-tauri",
    "crates/shk-core",
    "crates/shk-rules",
    "crates/shk-cli",
    "crates/shk-integrations",
    "xtask",
]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Kazuki-tam/security-harness-kit"
homepage = "https://github.com/Kazuki-tam/security-harness-kit"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = "3.3"
regex = "1.10"
ignore = "0.4"
rayon = "1.8"
thiserror = "2.0"
walkdir = "2.5"
hmac = "0.13"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
tempfile = "3"
zeroize = "1.8"
dialoguer = "0.12"
quick-xml = "0.40"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
pdf-extract = "0.10.0"
dotenvx = "0.2.2"
# Text-only clipboard access; image-data is intentionally disabled.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
