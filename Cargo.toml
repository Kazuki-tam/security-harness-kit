[workspace]
resolver = "2"
members = [
    "crates/shk-core",
    "crates/shk-rules",
    "crates/shk-cli",
    "crates/shk-integrations",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Kazuki-tam/security-harness-kit"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = "2.12"
regex = "1.10"
ignore = "0.4"
rayon = "1.8"
thiserror = "1.0"
walkdir = "2.5"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
tempfile = "3"
zeroize = "1.8"
