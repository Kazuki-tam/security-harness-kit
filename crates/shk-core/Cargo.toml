[package]
name = "shk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core scanning, masking, and policy for shk"
publish = false

[dependencies]
shk-rules = { version = "0.5.5", path = "../shk-rules" }
anyhow.workspace = true
ignore.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
walkdir.workspace = true
globset = "0.4"
hmac.workspace = true
# hmac 0.13 uses digest 0.11, while the workspace sha2 stays on 0.10 for shk-cli.
sha2_hmac = { package = "sha2", version = "0.11" }
chrono.workspace = true
zeroize.workspace = true
quick-xml.workspace = true
zip.workspace = true
pdf-extract.workspace = true
tempfile.workspace = true

[dev-dependencies]
