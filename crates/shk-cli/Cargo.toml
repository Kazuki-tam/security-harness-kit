[package]
name = "shk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "security-harness-kit CLI (shk)"

[lib]
name = "shk_cli"
path = "src/lib.rs"

[[bin]]
name = "shk"
path = "src/main.rs"

[[bin]]
name = "security-harness-kit"
path = "src/bin/security-harness-kit.rs"

[dependencies]
shk-core = { version = "0.1.5", path = "../shk-core" }
shk-integrations = { version = "0.1.5", path = "../shk-integrations" }
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
regex.workspace = true
toml.workspace = true
ureq.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
