[package]
name = "shk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "shk CLI"

[lib]
name = "shk_cli"
path = "src/lib.rs"

[[bin]]
name = "shk"
path = "src/main.rs"

# Match the Homebrew formula name to the binary (`shk`) instead of the crate
# name (`shk-cli`), so users install with `brew install <tap>/shk`.
[package.metadata.dist]
formula = "shk"

[dependencies]
shk-core = { version = "0.4.4", path = "../shk-core" }
shk-rules = { version = "0.4.4", path = "../shk-rules" }
shk-integrations = { version = "0.4.4", path = "../shk-integrations" }
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
dialoguer.workspace = true
ignore.workspace = true
regex.workspace = true
toml.workspace = true
ureq.workspace = true
zeroize.workspace = true
sha2.workspace = true
tempfile.workspace = true
dotenvx.workspace = true
arboard.workspace = true
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
zip.workspace = true
