approval_policy = "on-request"
sandbox_mode = "workspace-write"
[features]
hooks = true

# shk-managed-start
[[hooks.PreToolUse]]
matcher = ".*"
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'shk scan "$(git rev-parse --show-toplevel)" --hook-mode codex --log-blocked'
statusMessage = "shk: scanning for secrets..."

[[hooks.PermissionRequest]]
matcher = ".*"
timeout = 30

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'shk scan "$(git rev-parse --show-toplevel)" --hook-mode codex --log-blocked'
statusMessage = "shk: checking approval request..."

[[hooks.UserPromptSubmit]]
timeout = 30

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'shk scan "$(git rev-parse --show-toplevel)" --hook-mode codex --log-blocked'
statusMessage = "shk: scanning submitted prompt..."

[[hooks.PostToolUse]]
matcher = ".*"
timeout = 30

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'shk scan "$(git rev-parse --show-toplevel)" --hook-mode codex --log-blocked --post'
statusMessage = "shk: scanning tool output..."
# shk-managed-end
