[scan]
include = ["**/*"]
exclude = [
  ".git/**",
  "node_modules/**",
  "dist/**",
  "build/**",
  "coverage/**",
  "**/*.svg",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.gif",
  "**/*.webp",
  "**/*.ico",
  "**/*.avif",
  "**/*.bmp",
  "**/*.tif",
  "**/*.tiff",
  "**/*.mp4",
  "**/*.m4v",
  "**/*.mov",
  "**/*.webm",
  "**/*.mkv",
  "**/*.avi",
  "**/*.ogv",
  "**/*.mp3",
  "**/*.m4a",
  "**/*.wav",
  "**/*.flac",
  "**/*.aac",
  "**/*.ogg",
  "**/*.opus",
  "**/*.woff",
  "**/*.woff2",
  "**/*.ttf",
  "**/*.otf",
  "**/*.eot"
]
max_file_size_bytes = 1048576
binary_detection_bytes = 8192
follow_symlinks = false
include_binary = false

[rules]
secrets = true
pii = true
pii_languages = ["en", "ja"]
env = true
internal_terms = false
ai_context = true

[thresholds]
default_fail_on = "high"
scan_fail_on = "high"
pre_commit_fail_on = "high"

[mask]
mode = "strict"
redaction = "full"
# preserve_prefix = 4 # only when redaction = "partial"
# preserve_suffix = 4

[action_guard]
enabled = true
profile = "recommended" # minimal | recommended | strict
allow = []
deny = []

# Project-specific sensitive terms. Patterns use Rust regex syntax.
# [[custom_rules]]
# id = "internal.codename"
# pattern = "ProjectNebula|社外秘|CONFIDENTIAL_CLIENT_X"
# severity = "high"
# kind = "internal"
# message = "Internal confidential term detected"

[doctor.ignore]
required_patterns = [
  ".env",
  ".env.*",
  "!.env.example",
  "secrets/**",
  "credentials/**",
  "*.pem",
  "*.key",
  "*.p12",
  "*.mobileprovision",
  "*.log"
]

# Allowlist / inline suppressions (spec §5.3). Prefer path-scoped rows; use value_hash for value-specific cases.
# Inline: # shk-ignore-next-line <rule_id>

[[allowlist]]
path = "fixtures/pii/**"
reason = "Intentional PII detection demo fixtures"

[[allowlist]]
path = "fixtures/pii.txt"
reason = "Intentional PII detection demo fixture"

[[allowlist]]
path = "fixtures/secrets/**"
reason = "Intentional secrets detection demo fixtures"

