[advisories]
version = 2
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # Transitive quick-xml 0.39.4 pulled in by plist 1.9.0 <- tauri. The latest
  # published plist still requires quick-xml 0.39.x, so there is no upstream
  # fix we can pull via a dependency bump. Our direct dependency is already on
  # quick-xml 0.41.0 (unaffected). Re-evaluate and remove once plist releases a
  # version depending on quick-xml >= 0.41.0.
  { id = "RUSTSEC-2026-0194", reason = "Transitive quick-xml 0.39.4 via plist<-tauri; no upstream fix. Direct dependency is quick-xml 0.41.0." },
  { id = "RUSTSEC-2026-0195", reason = "Transitive quick-xml 0.39.4 via plist<-tauri; no upstream fix. Direct dependency is quick-xml 0.41.0." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]

exceptions = [
  { allow = ["Zlib"], crate = "foldhash" },
  { allow = ["Zlib"], crate = "zlib-rs" },
  { allow = ["CC0-1.0"], crate = "secp256k1" },
  { allow = ["CC0-1.0"], crate = "secp256k1-sys" },
  # BSL-1.0 (Boost Software License) is OSI-approved and FSF-free; pulled in by
  # arboard (clipboard access) on Windows targets.
  { allow = ["BSL-1.0"], crate = "clipboard-win" },
  { allow = ["BSL-1.0"], crate = "error-code" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
