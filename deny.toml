[advisories]
version = 2
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # Transitive zip 4.6.1 pulled in by tauri-plugin-updater 2.14.0 (Windows only).
  # The latest 2.x updater still requires zip 4.x, so there is no upstream fix
  # we can pull via a dependency bump. The updater verifies the minisign
  # signature before extracting, so only archives signed with our updater key
  # reach zip. Our direct dependency is already on zip 9.x (unaffected). Remove
  # once tauri-plugin-updater releases a version depending on zip >= 9.0.0.
  { id = "RUSTSEC-2026-0367", reason = "Transitive zip 4.6.1 via tauri-plugin-updater (Windows); no upstream fix. Archives are signature-verified before extraction." },
  { id = "RUSTSEC-2026-0368", reason = "Transitive zip 4.6.1 via tauri-plugin-updater (Windows); no upstream fix. Archives are signature-verified before extraction." },
  { id = "RUSTSEC-2026-0369", reason = "Transitive zip 4.6.1 via tauri-plugin-updater (Windows); no upstream fix. Archives are signature-verified before extraction." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]

exceptions = [
  { allow = ["Zlib"], crate = "foldhash" },
  { allow = ["Zlib"], crate = "zlib-rs" },
  { allow = ["CC0-1.0"], crate = "secp256k1" },
  { allow = ["CC0-1.0"], crate = "secp256k1-sys" },
  # BSL-1.0 (Boost Software License) is OSI-approved and FSF-free; pulled in by
  # arboard (clipboard access) on Windows targets.
  { allow = ["BSL-1.0"], crate = "clipboard-win" },
  { allow = ["BSL-1.0"], crate = "error-code" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
