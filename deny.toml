[advisories]
version = 2
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # chrono is flagged unmaintained; no vulnerability is reported. It is used
  # for UTC timestamps and `YYYY-MM-DD` allowlist expiry dates only (no
  # local-time or time-zone database code paths). Remove this entry when the
  # workspace has moved to `jiff` or `time`, or if a vulnerability advisory is
  # published for chrono.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained notice only, no vulnerability reported; used for UTC timestamps and date parsing" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]

exceptions = [
  { allow = ["Zlib"], crate = "foldhash" },
  { allow = ["Zlib"], crate = "zlib-rs" },
  { allow = ["CC0-1.0"], crate = "secp256k1" },
  { allow = ["CC0-1.0"], crate = "secp256k1-sys" },
  # BSL-1.0 (Boost Software License) is OSI-approved and FSF-free; pulled in by
  # arboard (clipboard access) on Windows targets.
  { allow = ["BSL-1.0"], crate = "clipboard-win" },
  { allow = ["BSL-1.0"], crate = "error-code" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
