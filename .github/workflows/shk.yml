# Generated by security-harness-kit. Regenerate with `shk ci init github --force`; manual edits will be overwritten.
name: Security Harness Kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shk
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/Kazuki-tam/security-harness-kit/releases/latest/download/shk-cli-installer.sh | sh

      - name: Run shk
        shell: bash
        run: |
          shk scan . --json --fail-on high
