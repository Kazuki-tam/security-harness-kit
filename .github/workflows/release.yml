name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: smoke version (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/shk --version
          ./target/${{ matrix.target }}/release/security-harness-kit --version

      - name: smoke version (Windows)
        if: runner.os == 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/shk.exe --version
          ./target/${{ matrix.target }}/release/security-harness-kit.exe --version

      - name: package artifact
        shell: bash
        run: bash scripts/package-release.sh "${{ matrix.target }}" "${GITHUB_REF_NAME#v}"

      - name: upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: shk-${{ matrix.target }}
          path: |
            target/dist/shk-${{ matrix.target }}.tar.gz
            target/dist/shk-${{ matrix.target }}.zip
          if-no-files-found: error

  checksums:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;

      - name: generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/shk-sbom.cdx.json
          upload-artifact: false

      - name: generate SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: generate Scoop manifest
        shell: bash
        run: |
          bash scripts/render-scoop-manifest.sh "${GITHUB_REF_NAME#v}" release-assets/SHA256SUMS release-assets/shk.json

      - name: generate Homebrew formula
        shell: bash
        run: |
          bash scripts/render-homebrew-formula.sh "${GITHUB_REF_NAME#v}" release-assets/SHA256SUMS release-assets/shk.rb

      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: sign release assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in release-assets/*; do
            [ -f "$asset" ] || continue
            cosign sign-blob --yes --bundle "${asset}.bundle" "$asset"
          done

      - name: attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
