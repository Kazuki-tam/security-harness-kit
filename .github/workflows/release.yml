# Release artifacts are built by dist. Keep platform/package settings in
# dist-workspace.toml and keep this workflow as thin orchestration around it.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  DIST_VERSION: "0.31.0"

jobs:
  build-local-artifacts:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: install dist
        if: runner.os != 'Windows'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: install dist
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm "https://github.com/axodotdev/cargo-dist/releases/download/v${env:DIST_VERSION}/cargo-dist-installer.ps1" | iex

      # dist.dependencies.apt documents the package requirements, but this
      # custom workflow invokes dist directly instead of using dist-generated CI.
      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: build dist artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: dist build --artifacts=local --target=${{ matrix.target }}

      - name: build dist artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: dist build --artifacts=local --target=${{ matrix.target }}

      - name: smoke version
        if: runner.os != 'Windows'
        shell: bash
        run: ./target/${{ matrix.target }}/dist/shk --version

      - name: smoke version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/${{ matrix.target }}/dist/shk.exe --version

      - name: upload local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-local-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip
            target/distrib/*.sha256
          if-no-files-found: error

  build-global-artifacts:
    name: build installers
    runs-on: ubuntu-22.04
    needs: build-local-artifacts
    steps:
      - uses: actions/checkout@v6

      - name: install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: download local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dist-local-*
          path: target/distrib
          merge-multiple: true

      - name: build global artifacts
        shell: bash
        run: dist build --artifacts=global

      - name: upload global artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-global
          path: |
            target/distrib/*-installer.sh
            target/distrib/*-installer.ps1
            target/distrib/*.rb
            target/distrib/source.tar.gz
            target/distrib/source.tar.gz.sha256
            target/distrib/sha256.sum
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-22.04
    needs: build-global-artifacts
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - name: install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: generate release body
        shell: bash
        run: |
          dist plan --output-format=json --no-local-paths > dist-plan.json
          jq -r '.announcement_github_body' dist-plan.json > release-body.md

      - name: generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/shk-sbom.cdx.json
          upload-artifact: false

      - name: attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-body.md
          generate_release_notes: true
