# Release artifacts are built by dist (CLI) and Tauri (desktop).
# Tag patterns:
#   vX.Y.Z          CLI only (backward compatible)
#   cli-vX.Y.Z      CLI only (explicit)
#   desktop-vX.Y.Z  Desktop app only
#   shk-vX.Y.Z      CLI + desktop together
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "cli-v*"
      - "desktop-v*"
      - "shk-v*"
  workflow_dispatch:
    inputs:
      component:
        description: "Which product to build"
        required: true
        type: choice
        options:
          - cli
          - desktop
          - both
      version:
        description: "Version in manifests (e.g. 0.3.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DIST_VERSION: "0.31.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-22.04
    outputs:
      build_cli: ${{ steps.resolve.outputs.build_cli }}
      build_desktop: ${{ steps.resolve.outputs.build_desktop }}
      component: ${{ steps.resolve.outputs.component }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: resolve
        shell: bash
        env:
          RELEASE_COMPONENT: ${{ github.event.inputs.component }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: ./.github/scripts/release/resolve-target.sh >> "$GITHUB_OUTPUT"

      - name: verify versions
        shell: bash
        env:
          RELEASE_COMPONENT: ${{ steps.resolve.outputs.component }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: ./.github/scripts/release/verify-versions.sh

  build-local-artifacts:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build_cli == 'true' }}
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # `dist build` compiles the whole workspace, so shk-desktop's build.rs runs
    # in release profile and would panic on its updater-pubkey guard. The desktop
    # artifact is discarded here (only shk-cli is packaged/published on this
    # path); the real desktop release job sets TAURI_UPDATER_PUBKEY, so the guard
    # still protects distributed desktop binaries.
    env:
      SHK_ALLOW_MISSING_UPDATER_PUBKEY: "1"
      BUILD_MANIFEST_NAME: target/distrib/${{ matrix.target }}-dist-manifest.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install dist
        if: runner.os != 'Windows'
        shell: bash
        run: curl --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: install dist
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm "https://github.com/axodotdev/cargo-dist/releases/download/v${env:DIST_VERSION}/cargo-dist-installer.ps1" | iex

      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: ./.github/scripts/ci/install-linux-deps.sh cli

      - name: build dist artifacts
        shell: bash
        run: |
          dist build --artifacts=local --target=${{ matrix.target }} \
            --print=linkage --output-format=json > dist-manifest.json
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: smoke version
        if: runner.os != 'Windows'
        shell: bash
        run: ./target/${{ matrix.target }}/dist/shk --version

      - name: smoke version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/${{ matrix.target }}/dist/shk.exe --version

      - name: upload local artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-local-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip
            target/distrib/*.sha256
            target/distrib/*-dist-manifest.json
          if-no-files-found: error

  build-desktop-artifacts:
    name: build desktop ${{ matrix.target }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build_desktop == 'true' }}
    environment:
      name: ${{ vars.RELEASE_ENVIRONMENT || 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/shk-desktop
    env:
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      SHK_ALLOW_UNSIGNED_WINDOWS: ${{ vars.SHK_ALLOW_UNSIGNED_WINDOWS }}
      TAURI_WINDOWS_SIGN_COMMAND: ${{ secrets.TAURI_WINDOWS_SIGN_COMMAND }}
      TAURI_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.TAURI_WINDOWS_CERTIFICATE_THUMBPRINT }}
      TAURI_WINDOWS_DIGEST_ALGORITHM: ${{ secrets.TAURI_WINDOWS_DIGEST_ALGORITHM }}
      TAURI_WINDOWS_TIMESTAMP_URL: ${{ secrets.TAURI_WINDOWS_TIMESTAMP_URL }}
      TAURI_WINDOWS_TSP: ${{ secrets.TAURI_WINDOWS_TSP }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/shk-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        working-directory: .
        run: ./.github/scripts/ci/install-linux-deps.sh desktop

      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          cache-bin: false

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: check desktop signing config
        shell: bash
        working-directory: .
        run: ./.github/scripts/release/check-desktop-signing.sh

      - name: generate updater config
        shell: bash
        working-directory: .
        run: |
          ./.github/scripts/release/generate-tauri-updater-config.sh \
            "target/tauri-updater-${{ matrix.target }}.json"

      - name: build desktop bundles
        shell: bash
        run: |
          pnpm tauri build \
            --target ${{ matrix.target }} \
            --config "../../target/tauri-updater-${{ matrix.target }}.json"

      - name: notarize and staple macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        working-directory: .
        run: |
          ./.github/scripts/release/notarize-macos-dmg.sh \
            "target/${{ matrix.target }}/release/bundle/dmg"

      - name: package desktop artifacts
        shell: bash
        working-directory: .
        run: |
          OUT="target/distrib/desktop/${{ matrix.target }}"
          ./.github/scripts/release/package-desktop-artifacts.sh \
            "${{ matrix.target }}" \
            "${{ needs.prepare.outputs.version }}" \
            "$OUT"

      - name: verify macOS desktop signatures and notarization
        if: runner.os == 'macOS'
        shell: bash
        working-directory: .
        run: bash ./.github/scripts/release/verify-macos-desktop-signatures.sh "target/distrib/desktop/${{ matrix.target }}"

      - name: verify Windows desktop signatures
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: ./.github/scripts/release/verify-windows-desktop-signatures.ps1 "target/distrib/desktop/${{ matrix.target }}"

      - name: upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.target }}
          path: target/distrib/desktop/${{ matrix.target }}/shk-desktop_*
          if-no-files-found: error

  build-global-artifacts:
    name: build installers
    runs-on: ubuntu-22.04
    needs: [prepare, build-local-artifacts]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build_cli == 'true' && needs.build-local-artifacts.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install dist
        shell: bash
        run: curl --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: download local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-local-*
          path: target/distrib
          merge-multiple: true

      - name: build global artifacts
        shell: bash
        run: dist build --artifacts=global

      - name: verify shell installer checksums
        shell: bash
        run: ./.github/scripts/release/verify-cli-installer-checksums.sh target/distrib

      - name: upload global artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-global
          path: |
            target/distrib/*-installer.sh
            target/distrib/*-installer.ps1
            target/distrib/*.rb
            target/distrib/*-npm-package.tar.gz
            target/distrib/source.tar.gz
            target/distrib/source.tar.gz.sha256
            target/distrib/sha256.sum
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: ${{ vars.RELEASE_ENVIRONMENT || 'release' }}
    needs: [prepare, build-global-artifacts, build-desktop-artifacts]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        startsWith(github.ref, 'refs/tags/') &&
        needs.prepare.result == 'success' &&
        needs.build-global-artifacts.result != 'failure' &&
        needs.build-desktop-artifacts.result != 'failure' &&
        (
          needs.build-global-artifacts.result == 'success' ||
          needs.build-desktop-artifacts.result == 'success'
        )
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install dist
        if: needs.prepare.outputs.build_cli == 'true'
        shell: bash
        run: curl --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: remove internal dist manifests
        shell: bash
        run: rm -f release-assets/*-dist-manifest.json

      - name: generate release body
        shell: bash
        env:
          RELEASE_COMPONENT: ${{ needs.prepare.outputs.component }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          # Lets the desktop notes state whether Windows installers are signed.
          SHK_ALLOW_UNSIGNED_WINDOWS: ${{ vars.SHK_ALLOW_UNSIGNED_WINDOWS }}
          TAURI_WINDOWS_SIGN_COMMAND: ${{ secrets.TAURI_WINDOWS_SIGN_COMMAND }}
          TAURI_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.TAURI_WINDOWS_CERTIFICATE_THUMBPRINT }}
          TAURI_WINDOWS_TIMESTAMP_URL: ${{ secrets.TAURI_WINDOWS_TIMESTAMP_URL }}
        run: ./.github/scripts/release/generate-release-body.sh

      - name: generate desktop checksums
        if: needs.prepare.outputs.build_desktop == 'true'
        shell: bash
        run: ./.github/scripts/release/generate-desktop-checksums.sh release-assets

      - name: generate desktop release manifest
        if: needs.prepare.outputs.build_desktop == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/release/generate-desktop-manifest.sh release-assets

      - name: generate Tauri updater latest.json
        if: needs.prepare.outputs.build_desktop == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/release/generate-tauri-latest-json.sh release-assets

      - name: generate winget manifests
        if: needs.prepare.outputs.build_cli == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/release/generate-winget-manifests.sh release-assets

      - name: generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/shk-sbom.cdx.json
          upload-artifact: false

      - name: attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: release-assets/*
          body_path: release-body.md
          generate_release_notes: true
          make_latest: ${{ needs.prepare.outputs.make_latest == 'true' }}

      - name: update v1 action tag
        if: needs.prepare.outputs.build_cli == 'true' && needs.prepare.outputs.make_latest == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1" \
              -f sha="$RELEASE_SHA" \
              -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/v1" \
              -f sha="$RELEASE_SHA"
          fi

      - name: publish desktop updater endpoint
        if: needs.prepare.outputs.build_desktop == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view desktop-latest >/dev/null 2>&1; then
            gh release create desktop-latest \
              --title "shk Desktop Latest" \
              --notes "Mutable endpoint for Tauri desktop updater metadata." \
              --latest=false
          fi
          gh release upload desktop-latest release-assets/latest.json --clobber

  # Push the dist-generated Homebrew formula to the public tap so users can run
  # `brew install Kazuki-tam/homebrew-tap/shk`. Requires a PAT with
  # `Contents: Read and write` on the tap repo, exposed as HOMEBREW_TAP_TOKEN.
  publish-homebrew-formula:
    name: publish Homebrew formula
    runs-on: ubuntu-22.04
    needs: [prepare, publish]
    if: >-
      ${{
        !cancelled() &&
        startsWith(github.ref, 'refs/tags/') &&
        needs.prepare.result == 'success' &&
        needs.publish.result == 'success' &&
        needs.prepare.outputs.build_cli == 'true' &&
        needs.prepare.outputs.make_latest == 'true'
      }}
    env:
      GIT_USER_NAME: "shk-release-bot"
      GIT_USER_EMAIL: "shk-release-bot@users.noreply.github.com"
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: checkout tap
        uses: actions/checkout@v7
        with:
          repository: Kazuki-tam/homebrew-tap
          persist-credentials: false

      - name: download global artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-global
          path: dist-global
          merge-multiple: true

      - name: commit formula
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p Formula
          found=0
          for rb in dist-global/*.rb; do
            cp "$rb" "Formula/$(basename "$rb")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no Homebrew formula (.rb) found in dist-global artifact" >&2
            exit 1
          fi
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          git add Formula/
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to push"
          else
            git commit -m "shk ${RELEASE_VERSION}"
            gh auth setup-git
            git push
          fi

  # Publish the dist-generated npm package so users can run
  # `npm install -g security-harness-kit`. Authenticates with npm trusted
  # publishing (GitHub Actions OIDC via `id-token: write`), which also signs
  # provenance — no npm token secret is used. The trusted publisher must be
  # configured on npmjs.com for the package: repository
  # Kazuki-tam/security-harness-kit, workflow release.yml.
  publish-npm-package:
    name: publish npm package
    runs-on: ubuntu-22.04
    needs: [prepare, publish]
    if: >-
      ${{
        !cancelled() &&
        startsWith(github.ref, 'refs/tags/') &&
        needs.prepare.result == 'success' &&
        needs.publish.result == 'success' &&
        needs.prepare.outputs.build_cli == 'true' &&
        needs.prepare.outputs.make_latest == 'true'
      }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: download global artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-global
          path: dist-global
          merge-multiple: true

      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24 bundles npm >= 11.5.1, required for OIDC trusted publishing.
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: publish to npm
        shell: bash
        env:
          EXPECTED_NPM_PACKAGE: security-harness-kit
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          npm --version
          # The leading ./ is required: without it npm treats the path as a
          # GitHub "user/repo" shortcut and fails with a git error (exit 128).
          pkgs=(./dist-global/*-npm-package.tar.gz)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one *-npm-package.tar.gz in dist-global artifact, found ${#pkgs[@]}" >&2
            exit 1
          fi

          pkg="${pkgs[0]}"
          pkg_json_path="$(tar -tzf "${pkg}" | awk -F/ 'NF == 2 && $2 == "package.json" && path == "" { path = $0 } END { print path }')"
          if [ -z "${pkg_json_path}" ]; then
            echo "::error::npm package tarball does not contain a top-level package.json" >&2
            exit 1
          fi
          pkg_json="$(tar -xzOf "${pkg}" "${pkg_json_path}")"
          name="$(jq -r .name <<<"${pkg_json}")"
          version="$(jq -r .version <<<"${pkg_json}")"
          if [ "${name}" != "${EXPECTED_NPM_PACKAGE}" ]; then
            echo "::error::expected npm package ${EXPECTED_NPM_PACKAGE}, found ${name}" >&2
            exit 1
          fi
          if [ "${version}" != "${RELEASE_VERSION}" ]; then
            echo "::error::expected npm package version ${RELEASE_VERSION}, found ${version}" >&2
            exit 1
          fi

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already published; nothing to do"
            exit 0
          fi
          npm publish "${pkg}" --provenance --access public
