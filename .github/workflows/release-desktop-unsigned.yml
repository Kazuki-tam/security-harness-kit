# Unsigned desktop releases: Tauri updater signing only (no Developer ID / Authenticode).
# Tag pattern:
#   desktop-unsigned-vX.Y.Z
name: Release Desktop (unsigned)

on:
  push:
    tags:
      - "desktop-unsigned-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version in manifests (e.g. 0.3.15)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-unsigned-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: prepare unsigned release
    runs-on: ubuntu-22.04
    outputs:
      component: ${{ steps.resolve.outputs.component }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: source
        shell: bash
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: resolve
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: ./.github/scripts/release/resolve-unsigned-target.sh >> "$GITHUB_OUTPUT"

      - name: verify versions
        shell: bash
        env:
          RELEASE_COMPONENT: ${{ steps.resolve.outputs.component }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: ./.github/scripts/release/verify-versions.sh

  build-desktop-artifacts:
    name: build unsigned desktop ${{ matrix.target }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    environment:
      name: ${{ vars.RELEASE_ENVIRONMENT || 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/shk-desktop
    env:
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/shk-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        working-directory: .
        run: ./.github/scripts/ci/install-linux-deps.sh desktop

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: check updater signing config
        shell: bash
        working-directory: .
        run: ./.github/scripts/release/check-desktop-updater-signing.sh

      - name: generate updater config
        shell: bash
        working-directory: .
        run: |
          ./.github/scripts/release/generate-tauri-updater-config.sh \
            "target/tauri-updater-${{ matrix.target }}.json" \
            "${{ matrix.bundles }}"

      - name: build desktop bundles
        shell: bash
        run: |
          pnpm tauri build \
            --target ${{ matrix.target }} \
            --config "../../target/tauri-updater-${{ matrix.target }}.json"

      - name: package desktop artifacts
        shell: bash
        working-directory: .
        run: |
          OUT="target/distrib/desktop/${{ matrix.target }}"
          ./.github/scripts/release/package-desktop-artifacts.sh \
            "${{ matrix.target }}" \
            "${{ needs.prepare.outputs.version }}" \
            "$OUT" \
            updater

      - name: upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.target }}
          path: target/distrib/desktop/${{ matrix.target }}/shk-desktop_*
          if-no-files-found: error

  publish:
    name: publish unsigned release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [prepare, build-desktop-artifacts]
    environment:
      name: ${{ vars.RELEASE_ENVIRONMENT || 'release' }}
    if: >-
      ${{
        always() &&
        !cancelled() &&
        startsWith(github.ref, 'refs/tags/') &&
        needs.prepare.result == 'success' &&
        needs.build-desktop-artifacts.result == 'success'
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: verify unsigned desktop release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/release/verify-unsigned-desktop-assets.sh release-assets

      - name: generate release body
        shell: bash
        env:
          RELEASE_COMPONENT: ${{ needs.prepare.outputs.component }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/release/generate-release-body.sh

      - name: generate desktop checksums
        shell: bash
        run: ./.github/scripts/release/generate-desktop-checksums.sh release-assets

      - name: generate desktop release manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/release/generate-desktop-manifest.sh release-assets

      - name: generate Tauri updater latest.json
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/release/generate-tauri-latest-json.sh release-assets

      - name: generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/shk-sbom.cdx.json
          upload-artifact: false

      - name: attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          files: release-assets/*
          body_path: release-body.md
          generate_release_notes: true
          make_latest: false
          prerelease: true

      - name: publish desktop updater endpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view desktop-latest >/dev/null 2>&1; then
            gh release create desktop-latest \
              --title "shk Desktop Latest" \
              --notes "Mutable endpoint for Tauri desktop updater metadata." \
              --latest=false
          fi
          gh release upload desktop-latest release-assets/latest.json --clobber
