name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: install Linux native dependencies
        if: runner.os == 'Linux'
        run: ./.github/scripts/ci/install-linux-deps.sh desktop

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: cargo build release
        run: cargo build --release

      - name: version (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk --version

      - name: version (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe --version

      - name: smoke scan (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk scan fixtures/basic --json --fail-on critical

      - name: smoke scan (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe scan fixtures/basic --json --fail-on critical

      - name: smoke mask (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk mask --json < fixtures/pii.txt

      - name: smoke mask (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./target/release/shk.exe mask --json < fixtures/pii.txt

      - name: smoke doctor ignore (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk doctor ignore fixtures/project

      - name: smoke doctor ignore (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe doctor ignore fixtures/project

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: install cargo-audit
        uses: taiki-e/install-action@60ae4ce63c7aeb6e96d7f572c1ec7fafbb17ca80 # v2
        with:
          tool: cargo-audit@0.22.1

      - name: install cargo-deny
        uses: taiki-e/install-action@60ae4ce63c7aeb6e96d7f572c1ec7fafbb17ca80 # v2
        with:
          tool: cargo-deny@0.19.7

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check

      - name: verify gitleaks rules sync
        run: |
          cargo run -p xtask -- import-gitleaks-rules --check \
            --input https://raw.githubusercontent.com/gitleaks/gitleaks/8863af47d64c3681422523e36837957c74d4af4b/config/gitleaks.toml \
            --output crates/shk-rules/src/gitleaks_rules.rs \
            --source-ref 8863af47d64c3681422523e36837957c74d4af4b

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/shk-desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/shk-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"

      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: ./.github/scripts/ci/install-linux-deps.sh desktop

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level high

      - name: frontend format
        run: pnpm fmt:check

      - name: frontend lint
        run: pnpm lint

      - name: frontend tests
        run: pnpm test:run

      - name: tauri build (no bundle)
        run: pnpm tauri build --no-bundle

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: test release scripts
        run: ./.github/scripts/release/test.sh
