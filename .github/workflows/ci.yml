name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: install Linux native keyring dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: cargo build release
        run: cargo build --release

      - name: version (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk --version

      - name: version (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe --version

      - name: smoke scan (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk scan fixtures/basic --json --fail-on critical

      - name: smoke scan (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe scan fixtures/basic --json --fail-on critical

      - name: smoke mask (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk mask --json < fixtures/pii.txt

      - name: smoke mask (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./target/release/shk.exe mask --json < fixtures/pii.txt

      - name: smoke doctor ignore (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk doctor ignore fixtures/project

      - name: smoke doctor ignore (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe doctor ignore fixtures/project

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shk-desktop
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/shk-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: frontend format
        run: pnpm fmt:check

      - name: frontend lint
        run: pnpm lint

      - name: frontend tests
        run: pnpm test:run

      - name: tauri build (no bundle)
        run: pnpm tauri build --no-bundle
