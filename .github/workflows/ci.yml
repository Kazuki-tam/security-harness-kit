name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: cargo build release
        run: cargo build --release

      - name: version (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/release/shk --version
          ./target/release/security-harness-kit --version

      - name: version (Windows)
        if: runner.os == 'Windows'
        run: |
          ./target/release/shk.exe --version
          ./target/release/security-harness-kit.exe --version

      - name: smoke scan (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk scan fixtures/basic --json --fail-on critical

      - name: smoke scan (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe scan fixtures/basic --json --fail-on critical

      - name: smoke mask (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk mask --json < fixtures/pii.txt

      - name: smoke mask (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./target/release/shk.exe mask --json < fixtures/pii.txt

      - name: smoke doctor ignore (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk doctor ignore fixtures/project

      - name: smoke doctor ignore (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe doctor ignore fixtures/project
