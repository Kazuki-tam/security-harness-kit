name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25"
          cache: false

      - name: install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: lint workflows
        run: "$(go env GOPATH)/bin/actionlint"

      - name: smoke local composite action
        uses: ./
        with:
          path: fixtures/basic
          fail-on: critical
          mode: blocking
          upload-sarif: false
          # The branch's default v0.5.6 binary does not exist until release.
          shk-version: v0.5.5

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: install Linux native dependencies
        if: runner.os == 'Linux'
        run: ./.github/scripts/ci/install-linux-deps.sh desktop

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: cargo build release
        run: cargo build --release
        env:
          # CI smoke build is not a distribution build; the desktop updater
          # pubkey assertion only applies to real release workflows.
          SHK_ALLOW_MISSING_UPDATER_PUBKEY: "1"

      - name: version (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk --version

      - name: version (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe --version

      - name: smoke scan (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk scan fixtures/basic --json --fail-on critical

      - name: smoke scan (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe scan fixtures/basic --json --fail-on critical

      - name: smoke mask (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk mask --json < fixtures/pii.txt

      - name: smoke mask (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./target/release/shk.exe mask --json < fixtures/pii.txt

      - name: smoke doctor ignore (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shk doctor ignore fixtures/project

      - name: smoke doctor ignore (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/shk.exe doctor ignore fixtures/project

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"
          components: llvm-tools-preview, rustfmt

      - name: install Linux native dependencies
        run: ./.github/scripts/ci/install-linux-deps.sh desktop

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-llvm-cov@0.6.21

      - name: cargo llvm-cov (line coverage >= 90%)
        run: bash ./.github/scripts/ci/rust-coverage.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: install cargo-audit
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-audit@0.22.1

      - name: install cargo-deny
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-deny@0.19.7

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check

      - name: verify gitleaks rules sync
        run: |
          cargo run -p xtask -- import-gitleaks-rules --check \
            --input https://raw.githubusercontent.com/gitleaks/gitleaks/8863af47d64c3681422523e36837957c74d4af4b/config/gitleaks.toml \
            --output crates/shk-rules/src/gitleaks_rules.rs \
            --source-ref 8863af47d64c3681422523e36837957c74d4af4b

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/shk-desktop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/shk-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"

      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: ./.github/scripts/ci/install-linux-deps.sh desktop

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level high

      - name: frontend format
        run: pnpm fmt:check

      - name: frontend lint
        run: pnpm lint

      - name: frontend tests
        run: pnpm test:run

      - name: tauri build (no bundle)
        run: pnpm tauri build --no-bundle
        env:
          # CI check build is not a distribution build; the updater pubkey
          # assertion only applies to real release workflows.
          SHK_ALLOW_MISSING_UPDATER_PUBKEY: "1"

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: test release scripts
        run: ./.github/scripts/release/test.sh
