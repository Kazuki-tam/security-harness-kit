# Audits this repository's Cargo.lock with the experimental `shk deps audit`.
# Kept apart from ci.yml (which has no schedule) and from shk.yml (generated by
# `shk ci init`, so manual edits there are overwritten).
name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily: a new advisory can affect a lockfile that has not changed.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: deps-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.90"

      - name: install Linux native dependencies
        run: ./.github/scripts/ci/install-linux-deps.sh cli

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          cache-bin: false

      # Until v0.8.0 is released, the command exists only in this source tree.
      - name: build shk
        run: cargo build --release --locked -p shk-cli

      - name: shk deps audit
        id: audit
        shell: bash
        run: |
          set +e
          ./target/release/shk deps audit --update --sarif > deps-audit.sarif
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0: nothing at the threshold, 1: findings. Both leave a report to
          # upload, so the job fails only after the upload step. Anything
          # else means the audit did not run.
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi

      # The token of a pull request from a fork, or from Dependabot, cannot
      # write security events.
      - name: upload SARIF
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: deps-audit.sarif
          # The tool name is `shk`, as for `shk scan`: without its own
          # category this upload would replace the scan results.
          category: shk-deps

      - name: fail on findings
        if: steps.audit.outputs.code != '0'
        run: |
          echo "shk deps audit reported findings at or above the threshold" >&2
          exit 1
